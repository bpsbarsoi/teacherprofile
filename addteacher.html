<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Teacher Profile</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #e5e7eb; padding: 20px; }
    .form-container { max-width: 600px; margin: auto; background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #426944; text-align: center; margin-bottom: 25px; }
    .group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    textarea { height: 80px; resize: vertical; }
    .btn { background: #426944; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #325034; }
    #statusMsg { text-align: center; margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 5px; display: none; }
    small { color: #666; font-size: 12px; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Add New Teacher Profile</h2>
  <form id="teacherForm">
    <div class="group"><label>Teacher Name</label><input type="text" id="Teacher Name" placeholder="Rajesh Khanna" required></div>
    <div class="group"><label>Designation</label><input type="text" id="Designation" value="TEACHER" required></div>
    <div class="group"><label>Skills</label><textarea id="Skills" placeholder="Teaching Planning, Learning Creativity, Classroom Conflict Resolution"></textarea></div>
    <div class="group"><label>Profile Summary</label><textarea id="Profile Summary" placeholder="I am an English language teacher..."></textarea></div>
    <div class="group">
      <label>Education</label>
      <textarea id="Education" placeholder="Children Education (2012 - 2017)&#10;University, Any City"></textarea>
      <small>Note: Use Enter (New line) to separate details.</small>
    </div>
    <div class="group">
      <label>Work Experience</label>
      <textarea id="Work Experience" placeholder="2017 - 2019&#10;Elementary school teacher."></textarea>
    </div>
    <div class="group"><label>Contact Me</label><textarea id="Contact Me" placeholder="+123-456-7890&#10;hello@reallygreatsite.com"></textarea></div>
    <div class="group"><label>Reference</label><textarea id="Reference" placeholder="Name&#10;Role, Company&#10;Phone Number"></textarea></div>
    <div class="group"><label>Photo Drive URL</label><input type="text" id="Photo_url" placeholder="Paste Google Drive Shareable Link" required></div>

    <button type="submit" class="btn" id="submitBtn">Submit Data</button>
  </form>
  <div id="statusMsg"></div>
</div>

<script>
  // Yahan apna Google Apps Script Web App URL paste karein
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKUc-mXhbWL1Qy_lHCPQLS0DMhZzzkV0iHJCxgfOuGiBrDntU3k778jICxZ8x56wmEkA/exec";

  document.getElementById("teacherForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("statusMsg");
    btn.innerText = "Submitting...";
    btn.disabled = true;

    // Data collect karna
    const payload = {
      "Teacher Name": document.getElementById("Teacher Name").value,
      "Designation": document.getElementById("Designation").value,
      "Skills": document.getElementById("Skills").value,
      "Profile Summary": document.getElementById("Profile Summary").value,
      "Education": document.getElementById("Education").value,
      "Work Experience": document.getElementById("Work Experience").value,
      "Contact Me": document.getElementById("Contact Me").value,
      "Reference": document.getElementById("Reference").value,
      "Photo_url": document.getElementById("Photo_url").value
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if(data.status === "success") {
        msg.style.display = "block";
        msg.style.backgroundColor = "#dcfce7";
        msg.style.color = "#166534";
        msg.innerText = "Teacher profile saved successfully!";
        document.getElementById("teacherForm").reset();
      } else {
        throw new Error(data.message);
      }
    })
    .catch(err => {
      msg.style.display = "block";
      msg.style.backgroundColor = "#fee2e2";
      msg.style.color = "#991b1b";
      msg.innerText = "Error: " + err.message;
    })
    .finally(() => {
      btn.innerText = "Submit Data";
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
